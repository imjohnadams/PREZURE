/* ================================================================
   ⑨ APP
   ================================================================ */
const App = {
  step:       1,
  address:    '',
  contractor: null,
  booking:    null,   // set by Calendar.confirm()

  async init() {
    Tracer.init();
    try {
      this.contractor = await ContractorService.load();
      const sub = UI.$('brand-sub');
      if (sub) sub.textContent = this.contractor.company_name;
      document.title = `Estimate — ${this.contractor.company_name}`;
      this.goTo(1);
    } catch (err) {
      this._renderLoadError(err.message);
    } finally {
      const ls = UI.$('loading-screen');
      ls?.classList.add('fade-out');
      setTimeout(() => ls?.remove(), 450);
    }
  },

  _renderLoadError(msg) {
    UI.$('sidebar-body').innerHTML = `
      <div style="padding-top:12px">
        <div class="step-label" style="color:#ff6b6b">Error</div>
        <div class="step-title">COULDN'T LOAD</div>
        <p class="step-desc">${msg}</p>
        <p class="area-note">Check your <code>?key=</code> URL parameter and server connection.</p>
      </div>`;
    UI.show('address-bg');
  },

  goTo(step) {
    this.step = step;
    const appEl = UI.$('app');
    if (appEl) { appEl.classList.remove('step-1','step-2','step-3'); appEl.classList.add('step-'+step); }
    // Lock body scroll on mobile during step 2 (map tracing)
    if (window.innerWidth <= 768) {
      document.body.classList.toggle('lock-scroll', step === 2);
    }
    this._updateDots(step);

    step === 1 ? UI.show('address-bg')      : UI.hide('address-bg');
    // map-layer uses offscreen instead of hidden so Google Maps keeps real dimensions
    const mapEl = UI.$('map-layer');
    if (step === 2) {
      mapEl?.classList.remove('offscreen');
      // Init map on first visit to step 2 (deferred from _mapsReady to avoid
      // Google's error dialog showing during step 1 while the map is offscreen).
      if (!MapService.map && window.google?.maps) {
        MapService.initMap('map-layer');
      }
      if (MapService.map) {
        google.maps.event.trigger(MapService.map, 'resize');
        // Navigate AFTER resize so the viewport isn't reset back to Florida.
        // setCenter is instant (no pan animation) → map is correct on first render.
        if (MapService._pendingLocation) {
          MapService.map.setCenter(MapService._pendingLocation);
          MapService.map.setZoom(20);
          MapService._pendingLocation = null;
        }
      }
    } else {
      mapEl?.classList.add('offscreen');
    }
    step === 2 ? UI.show('tracer-canvas')   : UI.hide('tracer-canvas');
    step === 2 ? UI.show('scale-bar')       : UI.hide('scale-bar');
    step === 3 ? UI.show('summary-preview') : UI.hide('summary-preview');

    if (step === 2) {
      Tracer.show();
    } else {
      Tracer.hide();
    }

    if (step === 3) this._buildPreview();
    this._renderSidebar(step);
  },

  _updateDots(active) {
    for (let i = 1; i <= 3; i++) {
      const d = UI.$(`dot-${i}`);
      if (!d) continue;
      d.className = 'step-dot' +
        (i < active  ? ' complete' : '') +
        (i === active ? ' active'  : '');
    }
  },

  _renderSidebar(step) {
    const body = UI.$('sidebar-body');
    body.innerHTML = '';
    body.classList.add('fade-up');
    setTimeout(() => body.classList.remove('fade-up'), 350);
    ({ 1:this._step1, 2:this._step2, 3:this._step3 }[step] || (()=>{})).call(this, body);
  },

  // ── STEP 1 ────────────────────────────────────────────────────
  _step1(body) {
    body.innerHTML = `
      <div class="step-label">Step 1 of 3</div>
      <div class="step-title">YOUR ADDRESS</div>
      <p class="step-desc">Enter the property address.</p>
      <div class="field">
        <label>Service Address</label>
        <div id="place-autocomplete-wrap"></div>
        <input type="hidden" id="address-input" />
      </div>
      <div class="err-text" id="addr-err"></div>
      <button class="btn btn-primary" onclick="App.submitAddress()">Trace →</button>
    `;

    // Mount the PlaceAutocompleteElement if the API is loaded
    if (window.google?.maps?.places?.PlaceAutocompleteElement) {
      MapService.initAutocomplete('place-autocomplete-wrap');
    } else {
      // Fallback: show a plain text input if Places API isn't available
      const wrap = UI.$('place-autocomplete-wrap');
      if (wrap) {
        wrap.innerHTML = '<input type="text" id="address-fallback" placeholder="123 Main St, City, State…" autocomplete="off" />';
        const fb = UI.$('address-fallback');
        fb?.focus();
        fb?.addEventListener('keydown', e => { if (e.key === 'Enter') App.submitAddress(); });
        // Sync fallback input to hidden input on change
        fb?.addEventListener('input', () => {
          const hi = UI.$('address-input');
          if (hi) hi.value = fb.value;
        });
      }
    }
  },

  async submitAddress() {
    const val = UI.$('address-input')?.value.trim();
    if (!val || val.length < 5) {
      UI.$('addr-err').textContent = 'Please enter a valid address.';
      return;
    }

    // Show loading state
    const btn = document.querySelector('#sidebar-body .btn-primary');
    if (btn) { btn.textContent = 'Locating…'; btn.disabled = true; }
    UI.$('addr-err').textContent = '';

    try {
      // Server-side geocoding — works regardless of Places API status
      const geo = await MapService.geocode(val);
      // Store coordinates for goTo(2) to consume after map resize
      MapService._pendingLocation = { lat: geo.lat, lng: geo.lng };
      this.onAddressSelected(geo.formatted_address || val);
    } catch (err) {
      UI.$('addr-err').textContent = err.message || 'Could not find that address.';
      if (btn) { btn.textContent = 'Trace →'; btn.disabled = false; }
    }
  },

  onAddressSelected(address) {
    this.address = address;
    Tracer.resetAll();
    this.goTo(2);
    // Bind Places autocomplete to the map now that map exists
    // (map is init'd inside goTo(2) above)
    // If Maps loaded, re-init Places on step 1 next time via goTo(1)
  },

  // ── STEP 2 ────────────────────────────────────────────────────
  _step2(body) {
    const hasPolys  = Tracer.polygons.length > 0;
    const isDrawing = Tracer.points.length > 0;

    const svcOptions = Object.entries(CONFIG.SERVICES).map(([k, s]) =>
      k === 'negative'
        ? `<option value="${k}">${s.label} (exclusion zone)</option>`
        : `<option value="${k}">${s.label} — $${s.rate.toFixed(2)}/sq ft</option>`
    ).join('');

    let dotCls = 'idle', statusTxt = 'Enable draw mode, then click canvas';
    if (isDrawing)     { dotCls='active'; statusTxt=`${Tracer.points.length} point${Tracer.points.length!==1?'s':''} placed`; }
    else if (hasPolys) { dotCls='done';   statusTxt=`${Tracer.polygons.length} area${Tracer.polygons.length!==1?'s':''} traced`; }

    const chips = Tracer.polygons.map((p, i) => {
      const svc  = CONFIG.SERVICES[p.type];
      const sqft = PricingEngine.computeAreaSqft(p.latLngs).toFixed(1);
      const prefix = p.type === 'negative' ? '−' : '~';
      return `<div class="poly-chip">
        <div class="poly-chip-swatch" style="background:${svc.color}"></div>
        <span class="poly-chip-lbl">${svc.label}</span>
        <span class="poly-chip-area">${prefix}${sqft} sq ft</span>
        <button class="poly-chip-del" onclick="Tracer.removePolygon(${i})" title="Delete area">✕</button>
      </div>`;
    }).join('');

    const currentColor = CONFIG.SERVICES[Tracer.currentType]?.color || '#1e90ff';
    const drawOn       = Tracer.drawMode;

    const isMobile = window.innerWidth <= 768;

    if (isMobile) {
      // ── Compact mobile layout ──────────────────────────────────
      body.innerHTML = `
        <div class="step-label">Step 2 of 3</div>
        <div class="step-title" style="font-size:20px;margin-bottom:6px;">TRACE AREA</div>

        <div class="mobile-toolbar">
          <select id="svc-select" class="mtb-select" onchange="App.onTypeChange(this.value)">
            ${svcOptions}
          </select>
          <button id="draw-mode-btn" class="btn ${drawOn ? 'btn-draw-on' : 'btn-draw-off'}"
            onclick="Tracer.setDrawMode(${!drawOn})">✏${drawOn ? ' ON' : ' OFF'}</button>
          <button class="btn btn-secondary" onclick="Tracer.undo()" title="Undo">↩</button>
          <button class="btn btn-secondary" onclick="Tracer.redo()" title="Redo">↪</button>
          <button class="btn btn-secondary" onclick="App.clearActive()" title="Clear points">✕</button>
          <button class="btn btn-danger" onclick="App.removeLastPoly()" title="Remove area">⊘</button>
        </div>

        <div class="status-bar" style="margin-bottom:6px;">
          <div class="s-dot ${dotCls}"></div>
          <span id="trace-status">${statusTxt}</span>
        </div>

        ${chips ? `<div class="mobile-chips poly-list">${chips}</div>` : ''}

        <button class="btn btn-primary" id="btn-estimate" ${!hasPolys?'disabled':''} onclick="App.goToSummary()" style="margin-bottom:6px;">
          View Estimate →
        </button>
        <button class="btn btn-ghost w-full" onclick="App.goTo(1)" style="font-size:12px;padding:6px;">← Back</button>
      `;
    } else {
      // ── Desktop layout ─────────────────────────────────────────
      body.innerHTML = `
        <div class="step-label">Step 2 of 3</div>
        <div class="step-title">TRACE AREA</div>
        <p class="step-desc">Select cleaning type, then click canvas to begin tracing. To close area, approach the first point.</p>

        <div class="zoom-row">
          <button class="btn btn-zoom" onclick="MapService.zoomIn()">+</button>
          <button class="btn btn-zoom" onclick="MapService.zoomOut()">−</button>
        </div>

        <button id="draw-mode-btn"
          class="btn ${drawOn ? 'btn-draw-on' : 'btn-draw-off'}"
          onclick="Tracer.setDrawMode(${!drawOn})" style="margin-bottom:10px;">
          ${drawOn ? '✏ Draw Mode: ON' : '✏ Draw Mode: OFF'}
        </button>

        <div class="field">
          <label>Cleaning Type</label>
          <div class="select-wrap">
            <span id="svc-dot" class="select-dot" style="background:${currentColor}"></span>
            <select id="svc-select" class="has-dot" onchange="App.onTypeChange(this.value)">
              ${svcOptions}
            </select>
          </div>
        </div>

        <div class="status-bar">
          <div class="s-dot ${dotCls}"></div>
          <span id="trace-status">${statusTxt}</span>
        </div>

        ${chips ? `<div class="poly-list">${chips}</div>` : ''}

        <div class="btn-row">
          <button class="btn btn-secondary" onclick="Tracer.undo()">↩ Undo</button>
          <button class="btn btn-secondary" onclick="Tracer.redo()">↪ Redo</button>
        </div>
        <div class="btn-row">
          <button class="btn btn-secondary" onclick="App.clearActive()">✕ Clear Points</button>
          <button class="btn btn-danger"    onclick="App.removeLastPoly()">⊘ Remove Area</button>
        </div>

        <div class="divider"></div>

        <button class="btn btn-primary" id="btn-estimate" ${!hasPolys?'disabled':''} onclick="App.goToSummary()">
          View Estimate →
        </button>
        <div class="mt-8"></div>
        <button class="btn btn-ghost w-full" onclick="App.goTo(1)">← Back to Address</button>

        <div class="tip-box">
          <ul>
            <li>Zoom map first, then enable Draw Mode</li>
            <li>Click to place points</li>
            <li>Approach start point to close shape</li>
            <li>Drag any point to adjust</li>
          </ul>
        </div>
      `;
    }

    const sel = UI.$('svc-select');
    if (sel) sel.value = Tracer.currentType;

  },

  _refreshDrawBtn() {
    const btn = UI.$('draw-mode-btn');
    if (!btn) return;
    const on = Tracer.drawMode;
    const isMobile = window.innerWidth <= 768;
    btn.className = `btn ${on ? 'btn-draw-on' : 'btn-draw-off'}`;
    btn.textContent = isMobile ? (on ? '✏ ON' : '✏ OFF') : (on ? '✏ Draw Mode: ON' : '✏ Draw Mode: OFF');
    btn.setAttribute('onclick', `Tracer.setDrawMode(${!on})`);
  },

  refreshTraceStatus() {
    const isDrawing = Tracer.points.length > 0;
    const hasPolys  = Tracer.polygons.length > 0;
    const el  = UI.$('trace-status');
    const btn = UI.$('btn-estimate');
    if (el) {
      if (isDrawing)     el.textContent = `${Tracer.points.length} point${Tracer.points.length!==1?'s':''} placed`;
      else if (hasPolys) el.textContent = `${Tracer.polygons.length} area${Tracer.polygons.length!==1?'s':''} traced`;
      else               el.textContent = 'Enable draw mode, then click canvas';
    }
    if (btn) btn.disabled = !hasPolys;
  },

  onPolygonClosed() { this._renderSidebar(2); },

  onTypeChange(type) {
    Tracer.setType(type);
    const dot = UI.$('svc-dot');
    if (dot) dot.style.background = CONFIG.SERVICES[type].color;
  },

  clearActive()    { Tracer.resetActive(); this.refreshTraceStatus(); },
  removeLastPoly() { Tracer.removeLastPolygon(); },

  goToSummary() {
    if (!Tracer.polygons.length) return;
    const ov = UI.$('calc-overlay');
    ov.classList.add('on');
    setTimeout(() => { ov.classList.remove('on'); this.goTo(3); }, 900);
  },

  // ── STEP 3 ────────────────────────────────────────────────────
  _step3(body) {
    const res = PricingEngine.calculate(Tracer.polygons);
    const fmt = PricingEngine.currency;

    const rows = Object.entries(CONFIG.SERVICES).map(([key, svc]) => {
      if (key === 'negative') return ''; // shown separately below
      const b = res.breakdown[key];
      if (!b || b.sqft < 0.01) return '';
      return `<div class="price-row">
        <span class="lbl">
          <span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${svc.color};flex-shrink:0"></span>
          ${svc.label} (${PricingEngine.sqft(b.sqft)})
        </span>
        <span class="val">${fmt(b.cost)}</span>
      </div>`;
    }).join('');

    const negRow = '';

    body.innerHTML = `
      <div class="step-label">Step 3 of 3</div>
      <div class="step-title">YOUR ESTIMATE</div>
      <p class="step-desc">Review the breakdown, then book a time.</p>

      <div class="price-breakdown">
        <div class="price-row"><span class="lbl">Base Fee</span><span class="val">${fmt(CONFIG.BASE_FEE)}</span></div>
        ${rows}
        ${negRow}
        <div class="price-row total-row">
          <span class="lbl">TOTAL ESTIMATE</span>
          <span class="val">${fmt(res.total)}</span>
        </div>
      </div>

      <p class="area-note">Total traced area: ${PricingEngine.sqft(res.totalSqft)}</p>

      <div class="field">
        <label>Your Name</label>
        <input type="text" id="cust-name" placeholder="Jane Smith" />
      </div>
      <div class="field">
        <label>Contact (Phone or Email)</label>
        <input type="text" id="cust-contact" placeholder="(555) 000-0000" />
      </div>

      <button class="btn btn-primary" id="btn-book" onclick="App.openCalendar()">
        ${this._hasCalendar() ? 'Select Date &amp; Download PDF →' : 'Download PDF →'}
      </button>
      <div class="mt-8"></div>
      <button class="btn btn-ghost w-full" onclick="App.goTo(2)">← Re-trace Area</button>
      <p style="font-size:10.5px;color:var(--text-muted);line-height:1.5;margin-top:18px;text-align:center;">Estimates are powered by Prezure. By submitting this form you agree to Prezure's <a href="../5/privacy.php" target="_blank" rel="noopener" style="color:var(--text-muted);text-decoration:underline;">Privacy Policy</a>.</p>
    `;
  },

  _hasCalendar() {
    const a = this.contractor?.availability || {};
    return a.days?.length > 0 && a.time_slots?.length > 0;
  },

  openCalendar() {
    const name = UI.$('cust-name')?.value.trim();
    if (!name) { UI.$('cust-name')?.focus(); return; }

    if (this._hasCalendar()) {
      const availability = this.contractor.availability;
      Calendar.open(availability, booking => {
        this.booking = booking;
        this.downloadPDF();
      });
    } else {
      this.booking = null;
      this.downloadPDF();
    }
  },

  // ── Preview ───────────────────────────────────────────────────
  async _buildPreview() {
    // Show the address above the preview image
    const addrEl = UI.$('preview-address');
    if (addrEl) addrEl.textContent = this.address || '';

    const pc = UI.$('preview-canvas');
    if (!pc) return;
    const container = UI.$('summary-preview');
    const isMobile = window.innerWidth <= 768;
    let cw, ch;
    if (isMobile) {
      const size = Math.min(Math.floor(container.clientWidth * 0.95), Math.floor(container.clientHeight * 0.9), 480);
      cw = size; ch = size;
    } else {
      cw = Math.min(Math.floor(container.clientWidth * 0.7), 620);
      ch = Math.min(Math.floor(container.clientHeight * 0.72), 480);
    }
    pc.width = cw; pc.height = ch;
    pc.style.width = cw + 'px'; pc.style.height = ch + 'px';
    await Tracer.drawPreviewWithMap(pc);

    const legend = UI.$('preview-legend');
    if (!legend) return;
    const used = [...new Set(Tracer.polygons.map(p => p.type))];
    legend.innerHTML = used.map(t => {
      const svc = CONFIG.SERVICES[t];
      return `<div class="legend-item"><div class="legend-swatch" style="background:${svc.color}"></div>${svc.label}</div>`;
    }).join('');
  },

  // ── Send ──────────────────────────────────────────────────────
  async downloadPDF() {
    const name    = UI.$('cust-name')?.value.trim();
    const contact = UI.$('cust-contact')?.value.trim();
    if (!name) return;

    const btn = UI.$('btn-book');
    if (btn) { btn.textContent = 'Generating PDF…'; btn.disabled = true; }

    try {
      const res = PricingEngine.calculate(Tracer.polygons);
      const fmt = PricingEngine.currency;
      const b   = this.booking;

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit: 'mm', format: 'letter' });
      const pageW = 215.9;
      const marginL = 20, marginR = 20;
      const contentW = pageW - marginL - marginR;
      const rightX = pageW - marginR;
      let y = 18;

      // Header
      doc.setFont('Helvetica', 'bold');
      doc.setFontSize(22);
      doc.setTextColor(0, 0, 0);
      doc.text((this.contractor.company_name || 'PREZURE ESTIMATE').toUpperCase(), marginL, y);
      y += 4;
      doc.setDrawColor(0, 0, 0);
      doc.setLineWidth(0.5);
      doc.line(marginL, y, rightX, y);
      y += 10;

      // Customer info
      doc.setFontSize(11);
      doc.setTextColor(80, 80, 80);
      const info = [
        ['Customer:', name],
        ['Contact:', contact || 'N/A'],
        ['Address:', this.address || 'N/A'],
      ];
      if (b) {
        info.push(['Date:', b.displayDate]);
        info.push(['Time:', b.displayTime]);
      }
      for (const [label, value] of info) {
        doc.setFont('Helvetica', 'bold');
        doc.text(label, marginL, y);
        doc.setFont('Helvetica', 'normal');
        doc.text(String(value), marginL + 28, y);
        y += 6;
      }
      y += 4;

      // Estimate heading
      doc.setDrawColor(180, 180, 180);
      doc.setLineWidth(0.3);
      doc.line(marginL, y, rightX, y);
      y += 7;
      doc.setFont('Helvetica', 'bold');
      doc.setFontSize(13);
      doc.setTextColor(0, 0, 0);
      doc.text('ESTIMATE BREAKDOWN', marginL, y);
      y += 3;
      doc.setDrawColor(180, 180, 180);
      doc.line(marginL, y, rightX, y);
      y += 7;

      // Price rows
      doc.setFontSize(11);
      doc.setFont('Helvetica', 'normal');
      doc.setTextColor(60, 60, 60);
      doc.text('Base Fee', marginL, y);
      doc.text(fmt(CONFIG.BASE_FEE), rightX, y, { align: 'right' });
      y += 6;

      for (const [key, svc] of Object.entries(CONFIG.SERVICES)) {
        if (key === 'negative') continue;
        const bd = res.breakdown[key];
        if (!bd || bd.sqft < 0.01) continue;
        doc.text(`${svc.label} (${PricingEngine.sqft(bd.sqft)})`, marginL, y);
        doc.text(fmt(bd.cost), rightX, y, { align: 'right' });
        y += 6;
      }

      // Total
      y += 2;
      doc.setDrawColor(0, 0, 0);
      doc.setLineWidth(0.5);
      doc.line(marginL, y, rightX, y);
      y += 7;
      doc.setFont('Helvetica', 'bold');
      doc.setFontSize(14);
      doc.setTextColor(0, 0, 0);
      doc.text('TOTAL', marginL, y);
      doc.text(fmt(res.total), rightX, y, { align: 'right' });
      y += 12;

      // Preview image
      const pc = UI.$('preview-canvas');
      if (pc) {
        try {
          const imgData = pc.toDataURL('image/png');
          const imgW = contentW;
          const imgH = imgW * (pc.height / pc.width);
          const maxH = 279.4 - y - 20;
          const finalH = Math.min(imgH, maxH);
          const finalW = finalH === imgH ? imgW : finalH * (pc.width / pc.height);
          const imgX = marginL + (contentW - finalW) / 2;
          doc.addImage(imgData, 'PNG', imgX, y, finalW, finalH);
          y += finalH + 6;
        } catch (e) { /* CORS or tainted canvas — skip image */ }
      }

      // Footer
      doc.setFont('Helvetica', 'normal');
      doc.setFontSize(8);
      doc.setTextColor(150, 150, 150);
      doc.text('Generated by Prezure', marginL, 279.4 - 10);
      doc.text(new Date().toLocaleString(), rightX, 279.4 - 10, { align: 'right' });

      doc.save('Prezure-Estimate.pdf');

      // ── Submit to backend (email contractor + log estimate) ──
      const previewCanvas = UI.$('preview-canvas');
      let previewImage = '';
      try { previewImage = previewCanvas ? previewCanvas.toDataURL('image/png') : ''; } catch (_) {}

      const payload = {
        // Auth: server re-derives contractor_id from the calculator_key.
        // Sending the ID would let an attacker target any contractor.
        calculator_key: ContractorService.key || new URLSearchParams(window.location.search).get('key') || '',
        customer: {
          name:    name,
          contact: contact || '',
          address: this.address || '',
        },
        booking: b ? {
          date:        b.date,
          time:        b.time,
          displayDate: b.displayDate,
          displayTime: b.displayTime,
        } : { date: '', time: '', displayDate: '', displayTime: '' },
        estimate: {
          base_fee:      CONFIG.BASE_FEE,
          service_total: res.serviceTotal,
          total:         res.total,
          totalSqft:     res.totalSqft,
          breakdown:     res.breakdown,
        },
        areas: Object.entries(CONFIG.SERVICES)
          .filter(([k]) => k !== 'negative')
          .filter(([k]) => res.breakdown[k] && res.breakdown[k].sqft > 0)
          .map(([k, svc]) => ({
            label: svc.label,
            sqft:  res.breakdown[k].sqft,
            rate:  svc.rate,
          })),
        preview_image: previewImage,
        map_center: MapService.map
          ? { lat: MapService.map.getCenter().lat(), lng: MapService.map.getCenter().lng() }
          : { lat: 0, lng: 0 },
        map_zoom:    MapService.map ? MapService.map.getZoom() : 18,
        coordinates: Tracer.polygons.map(p => ({ latLngs: p.latLngs, type: p.type })),
        timestamp:   new Date().toISOString(),
      };

      await fetch('submit.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });

      this._renderSuccess(res);
    } catch (err) {
      console.error('PDF generation failed:', err);
      if (btn) {
        btn.textContent = this._hasCalendar() ? 'Select Date & Download PDF →' : 'Download PDF →';
        btn.disabled = false;
      }
      alert(`Could not generate PDF: ${err.message}`);
    }
  },

  _renderSuccess(res) {
    const body = UI.$('sidebar-body');
    const b    = this.booking;
    body.innerHTML = `
      <div class="success-screen fade-up">
        <div class="success-ring">✓</div>
        <h2>PDF DOWNLOADED!</h2>
        <p>Your estimate has been saved. Share it with ${this.contractor.company_name} to schedule your service.</p>
        <div class="price-breakdown" style="width:100%;text-align:left;">
          <div class="price-row"><span class="lbl">Address</span><span class="val" style="font-size:12px;max-width:55%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;">${this.address}</span></div>
          ${b ? `<div class="price-row"><span class="lbl">Requested</span><span class="val" style="font-size:12px;">${b.displayDate} at ${b.displayTime}</span></div>` : ''}
          <div class="price-row total-row"><span class="lbl">TOTAL</span><span class="val">${PricingEngine.currency(res.total)}</span></div>
        </div>
        <p style="font-size:11px;color:var(--text-muted);line-height:1.5;margin-top:14px;">The selected time is not guaranteed. The contractor will reach out to confirm scheduling and discuss further details.</p>
        <button class="btn btn-secondary w-full mt-12" onclick="location.reload()">Start New Estimate</button>
      </div>
    `;
    this._updateDots(4);
  },
};


/* ================================================================
   ⑩ BOOT
   ================================================================ */

// Called by Google Maps once its script has fully loaded.
window._mapsReady = function () {
  // Map is created in goTo(2) when the layer is visible — not here.
  // Address coordinates come from geocode.php (server-side).
  // If step 1 is showing and autocomplete hasn't been mounted yet, mount it now.
  const wrap = document.getElementById('place-autocomplete-wrap');
  if (wrap && window.google?.maps?.places?.PlaceAutocompleteElement) {
    wrap.innerHTML = '';
    MapService.initAutocomplete('place-autocomplete-wrap');
  }
};

// Injects the Maps script tag using the URL returned by contractor.php.
// The API key is embedded in that URL by PHP — it never exists in
// this JS file, only in PHP's server-side environment.
function _loadMapsScript(url) {
  const s = document.createElement('script');
  s.src   = url;                  // e.g. "…/maps/api/js?key=SERVER_SIDE_KEY&…"
  s.async = true;
  s.defer = true;
  s.onerror = () => console.error('[Prezure] Google Maps failed to load. Check the PHP MAPS_API_KEY setting and billing status.');
  document.head.appendChild(s);
}

window.addEventListener('DOMContentLoaded', () => App.init());
</script>
</body>
